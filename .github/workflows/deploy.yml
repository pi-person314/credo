# Deploys the runner to the Azure VM with infra/deploy.sh, from a GitHub-hosted runner.
# Claude cloud sessions can only reach the internet on 80/443, so they can't SSH to the VM themselves;
# this workflow does it for them (and for anyone without the key).
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   VM_SSH_KEY   private key whose .pub is in vmadmin's ~/.ssh/authorized_keys on the VM
# and the VM's NSG must allow inbound 22 from GitHub Actions (simplest: any source, key auth only).
#
# Runs on every push to main that touches the runner side, and on demand (Actions → deploy → Run workflow).
name: deploy
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Only check SSH, the edge Caddy and .env; don't deploy
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [runner/**, packages/**, infra/**, pnpm-lock.yaml, .github/workflows/deploy.yml]
concurrency: { group: deploy-vm, cancel-in-progress: false }
env:
  VM_HOST: vmadmin@pr-agent-saksham-20261024.westus2.cloudapp.azure.com
  PUBLIC_URL: https://pr-agent-saksham-20261024.westus2.cloudapp.azure.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        id: key
        env: { VM_SSH_KEY: '${{ secrets.VM_SSH_KEY }}' }
        run: |
          if [ -z "$VM_SSH_KEY" ]; then echo "::warning::VM_SSH_KEY secret is not set; skipping deploy"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm && chmod 600 ~/.ssh/vm
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Probe the VM
        if: steps.key.outputs.ok
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/vm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VM_HOST" '
            set -x
            hostname; id; sudo -n true && echo "sudo ok"; uptime; df -h / | tail -1
            sudo -n docker ps --format "{{.Names}}\t{{.Status}}\t{{.Ports}}"
            ls -la /opt/pr-agent /opt/pr-agent/edge || true
            ls -la /opt/pr-agent/app
            test -s /opt/pr-agent/app/.env && echo ".env present, keys: $(sudo -n grep -oE "^[A-Z_][A-Z0-9_]*=" /opt/pr-agent/app/.env | tr -d = | tr "\n" " ")" || echo ".env MISSING"
            ss -ltnp 2>/dev/null | grep -E ":(80|443|4100)\b" || true
          '
      - name: Deploy
        if: steps.key.outputs.ok && !inputs.probe_only
        run: VM_KEY=~/.ssh/vm infra/deploy.sh
      - name: Public health
        if: steps.key.outputs.ok && !inputs.probe_only
        run: |
          curl -fsS "$PUBLIC_URL/healthz"; echo
          for i in $(seq 1 15); do curl -fsS "$PUBLIC_URL/health" && echo && exit 0; sleep 2; done
          echo "::error::runner not reachable through the edge Caddy"; exit 1
