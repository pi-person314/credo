name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:contracts
  forge-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
