# Runner side only (the Forge app runs on Atlassian). Forge must reach the runner over public HTTPS.
#
#   Local laptop:  docker compose -f infra/compose.yml --profile tunnel up --build
#                  then copy the https://<random>.trycloudflare.com URL from the cloudflared logs
#   Azure VM:      docker compose -f infra/compose.yml --profile vm up -d --build   (needs DOMAIN)
#
# Sandboxes (sb-<session>-base / -head) are started by the runner at runtime, not listed here.
name: pr-agent

services:
  runner:
    build: { context: .., dockerfile: runner/Dockerfile }
    env_file: ../.env
    environment:
      ARTIFACTS_DIR: /data/artifacts
    ports: ["4100:4100"]
    volumes:
      - artifacts:/data/artifacts
      - /var/run/docker.sock:/var/run/docker.sock   # starts sandboxes; only on a machine you trust

  # Local: free Cloudflare quick tunnel, no account. The URL changes on every restart.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate --url http://runner:4100
    depends_on: [runner]

  # VM: HTTPS on a real DNS name.
  caddy:
    profiles: [vm]
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on: [runner]

volumes:
  artifacts:
  caddy_data:
