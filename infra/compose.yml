# Runner side only (the Forge app runs on Atlassian). On the VM:
#   cp .env.example .env && docker compose -f infra/compose.yml up -d --build
# Sandboxes (sb-<session>-base / -head) are started by the runner at runtime, not listed here.
name: pr-agent

services:
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on: [runner]

  runner:
    build: { context: .., dockerfile: runner/Dockerfile }
    env_file: ../.env
    environment:
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
      - /var/run/docker.sock:/var/run/docker.sock   # starts sandboxes; dedicated VM only

volumes:
  artifacts:
  caddy_data:
