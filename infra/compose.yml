# Runner side only (the Forge app runs on Atlassian). Forge must reach the runner over public HTTPS.
#
#   Azure VM (edge Caddy already on 80/443, see infra/edge/):
#                  docker compose -f infra/compose.yml up -d --build runner
#                  the runner listens on 127.0.0.1:4100 only; the edge Caddy proxies to it
#   Laptop:        docker compose -f infra/compose.yml --profile tunnel up --build
#                  then copy the https://<random>.trycloudflare.com URL from the cloudflared logs
#   VM without an edge proxy: add --profile caddy (needs DOMAIN; takes 80/443)
#
# Sandboxes (sb-<session>-base / -head) are started by the runner at runtime on the host's Docker daemon,
# not listed here.
name: pr-agent

services:
  runner:
    build: { context: .., dockerfile: runner/Dockerfile }
    image: pr-agent-runner
    container_name: pr-agent-runner
    restart: unless-stopped
    env_file: ../.env
    environment:
      WORK_DIR: /data/work
      ARTIFACTS_DIR: /data/artifacts
      SANDBOX_NETWORK_MODE: attach # the runner joins each sandbox's internal network
      RUNNER_CONTAINER: pr-agent-runner
    ports: ["127.0.0.1:4100:4100"]
    volumes:
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock # starts sandboxes; only on a machine you trust
    shm_size: 1gb # Chromium

  # Laptop: free Cloudflare quick tunnel, no account. The URL changes on every restart.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate --url http://runner:4100
    depends_on: [runner]

  # A VM with nothing else on 80/443: HTTPS on a real DNS name.
  caddy:
    profiles: [caddy]
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on: [runner]

volumes:
  runner-data:
  caddy_data:
